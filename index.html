<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Gambar Transaksi WPA SHOP</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }
        p.info {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }
        .upload-section {
            margin-bottom: 15px;
            border: 1px dashed #ccc;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .upload-section input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
            width: 90%;
        }
        .upload-btn:active {
            background-color: #0056b3;
        }
        #previewContainer {
            display: none;
            margin-top: 10px;
        }
        /* Canvas digunakan untuk meresize dan menampilkan gambar */
        canvas {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }
        .print-btn {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .print-btn:active {
            background-color: #218838;
        }
        .print-btn:disabled {
            background-color: #94d3a2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cetak Foto Transaksi</h2>
        <p class="info">Otomatis Resize ke Kertas 58mm (384px)</p>
        
        <div class="upload-section">
            <label class="upload-btn" for="inputFoto">
                📁 Pilih Foto Transaksi
            </label>
            <input type="file" id="inputFoto" accept="image/*" onchange="prosesGambar(event)">
            
            <div id="previewContainer">
                <p style="font-size: 12px; color: #555; margin: 0 0 5px 0;">Pratinjau Hasil Cetak:</p>
                <!-- Gambar akan digambar ulang di dalam canvas ini -->
                <canvas id="canvasPreview"></canvas>
            </div>
        </div>

        <button id="btnCetak" class="print-btn" onclick="cetakGambarKeRawBT()" disabled>🖨️ Cetak Gambar via RawBT</button>
    </div>

    <script>
        // Variabel untuk menyimpan data gambar yang sudah diproses
        var dataGambarBase64 = "";

        function prosesGambar(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.getElementById('canvasPreview');
                    var ctx = canvas.getContext('2d');
                    
                    // --- LOGIKA RESIZE UNTUK PRINTER 58MM ---
                    // Lebar maksimal area cetak printer 58mm adalah 384 titik (pixel).
                    // Kita kunci lebarnya di 384px agar tidak memberatkan memori HP dan Intent.
                    var maxWidth = 384; 
                    
                    // Hitung skala tinggi gambar agar tetap proporsional (tidak gepeng)
                    var scale = maxWidth / img.width;
                    var newHeight = Math.round(img.height * scale);
                    
                    canvas.width = maxWidth;
                    canvas.height = newHeight;
                    
                    // Beri warna dasar putih (mencegah background hitam jika ada transparansi)
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Gambar ulang foto ke dalam canvas dengan ukuran baru
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Ubah canvas menjadi format data URL (JPEG, kualitas 80%)
                    // Kualitas 80% sudah sangat cukup untuk printer thermal hitam-putih
                    dataGambarBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Tampilkan area pratinjau dan aktifkan tombol cetak
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('btnCetak').disabled = false;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function cetakGambarKeRawBT() {
            if (!dataGambarBase64) {
                alert("Harap unggah foto transaksi terlebih dahulu.");
                return;
            }
            
            // Aplikasi RawBT otomatis mengenali format string "data:image/jpeg;base64,..." 
            // dan akan langsung mencetaknya sebagai gambar grafis, bukan sebagai teks.
            var intentUrl = "intent:" + encodeURIComponent(dataGambarBase64) + "#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;";
            
            // Buka aplikasi RawBT
            window.location.href = intentUrl;
        }
    </script>
</body>
</html>
